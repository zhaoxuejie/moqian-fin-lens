[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moqian-fin-lens"
version = "0.4.0"
description = "A-share financial report parser: extract core metrics and visualize fundamentals."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "financial-analysis",
  "stock-analysis",
  "a-share",
  "financial-report",
  "pdf-parser",
  "data-visualization",
  "fundamental-analysis",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic-settings>=2.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.0",
  "pdfplumber>=0.11",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schema = ["*.yaml"]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["core", "store", "app", "parse", "schema", "align", "metrics", "dashboard", "anomaly", "export", "traceability", "jobs"]
omit = [
  "src/app/templates/*",
  "src/app/static/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
